<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOVREN CLOTHING — Coming Soon</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --text-main: #f5f5f5;
      --text-muted: #888888;
      --input-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.15);
      --border-focus: rgba(255, 255, 255, 0.4);
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand-name {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      color: var(--text-main);
    }

    .headline {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .subtext {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      font-weight: 400;
      margin-bottom: 2.5rem;
      max-width: 360px;
    }

    .signup-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-bottom: 1.25rem;
    }

    .email-input {
      width: 100%;
      padding: 1.1rem 1.25rem;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s ease, background-color 0.3s ease;
      text-align: center;
    }

    .email-input::placeholder {
      color: #555555;
    }

    .email-input:focus {
      border-color: var(--border-focus);
      background-color: rgba(255, 255, 255, 0.05);
    }

    .submit-btn {
      width: 100%;
      padding: 1.1rem;
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .submit-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .disclaimer {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="brand-name">SOVREN CLOTHING</div>
    <h1 class="headline">COMING SOON</h1>
    <p class="subtext">Something new is coming. Join the list and be the first to know when we launch.</p>

    <form class="signup-form" action="https://formspree.io/f/xppwnlna" method="POST">
      <input type="email" name="email" class="email-input" placeholder="Enter your email" required />
      <button type="submit" class="submit-btn">JOIN THE LIST</button>
    </form>

    <p class="disclaimer">No spam. Just updates from Sovren Clothing.</p>
  </main>

</body>
</html>
