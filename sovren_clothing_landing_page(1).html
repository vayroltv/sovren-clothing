<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVREN CLOTHING — Coming Soon</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Playfair Display for Serif Logo & Inter for Body/Headings -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fafafa;
            color: #111111;
        }

        .brand-logo {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.15em;
        }

        /* Subtle Fade In Animation */
        .fade-in-up {
            animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(12px);
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.25s; }
        .delay-3 { animation-delay: 0.4s; }
        .delay-4 { animation-delay: 0.55s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center px-6 py-8 md:py-12 select-none overflow-x-hidden">

    <!-- Top Spacer / Ambient Header -->
    <header class="w-full max-w-xl text-center fade-in-up delay-1">
        <div class="inline-block w-2 h-2 rounded-full bg-neutral-900 opacity-20 mb-2"></div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-md my-auto text-center flex flex-col items-center">
        
        <!-- Brand Name -->
        <h1 class="brand-logo text-2xl md:text-3xl font-bold tracking-widest text-neutral-900 mb-8 uppercase fade-in-up delay-1">
            SOVREN CLOTHING
        </h1>

        <!-- Headline -->
        <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight text-neutral-900 mb-4 fade-in-up delay-2">
            COMING SOON
        </h2>

        <!-- Subtitle -->
        <p class="text-neutral-500 text-sm md:text-base font-normal leading-relaxed max-w-sm mb-10 fade-in-up delay-3">
            Something new is coming. Join the list and be the first to know when we launch.
        </p>

        <!-- Newsletter Form -->
        <div class="w-full fade-in-up delay-4">
            <form id="newsletterForm" onsubmit="handleSubscribe(event)" class="space-y-3">
                <div class="relative w-full">
                    <input 
                        type="email" 
                        id="emailInput" 
                        required 
                        placeholder="Enter your email" 
                        class="w-full px-5 py-4 bg-white border border-neutral-200 rounded-2xl text-neutral-900 placeholder-neutral-400 text-sm md:text-base focus:outline-none focus:border-neutral-900 transition-all duration-300 shadow-sm"
                    >
                </div>

                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full py-4 bg-neutral-900 hover:bg-neutral-800 text-white font-medium text-sm md:text-base rounded-2xl transition-all duration-300 active:scale-[0.99] shadow-md hover:shadow-lg flex items-center justify-center"
                >
                    <span id="btnText">JOIN THE LIST</span>
                </button>
            </form>

            <!-- Success Message Container -->
            <div id="successMessage" class="hidden p-4 rounded-2xl bg-neutral-100 border border-neutral-200 text-neutral-800 text-sm font-medium transition-all duration-300">
                ✓ Thank you. You are on the list.
            </div>

            <!-- Small Micro-copy -->
            <p class="text-xs text-neutral-400 mt-4 tracking-wide">
                No spam. Just updates from Sovren Clothing.
            </p>
        </div>

    </main>

    <!-- Minimal Footer -->
    <footer class="w-full max-w-xl text-center text-xs text-neutral-400 tracking-wider uppercase fade-in-up delay-4 pt-8">
        © <span id="year"></span> SOVREN CLOTHING. ALL RIGHTS RESERVED.
    </footer>

    <script>
        // Set dynamic year
        document.getElementById('year').textContent = new Date().getFullYear();

        // Handle Newsletter Form Submission
        function handleSubscribe(e) {
            e.preventDefault();

            const emailInput = document.getElementById('emailInput');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const successMessage = document.getElementById('successMessage');
            const form = document.getElementById('newsletterForm');

            if (!emailInput.value) return;

            // Simple loading state
            btnText.textContent = 'ADDING...';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80');

            // Simulate quick API network request delay
            setTimeout(() => {
                form.classList.add('hidden');
                successMessage.classList.remove('hidden');
            }, 800);
        }
    </script>
</body>
</html>
